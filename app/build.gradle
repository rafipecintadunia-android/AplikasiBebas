apply plugin: 'com.android.application'
android {
    namespace 'com.google.developer'
    compileSdk 34
    defaultConfig {
        applicationId "com.google.developer"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "4.1"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
}
